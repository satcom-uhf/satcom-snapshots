<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>SATCOM 248–268 MHz // Spectrum Archive</title>
<style>
  :root{--bg:#05080f;--panel:rgba(11,18,32,.92);--border:rgba(0,240,255,.25);--cyan:#00f0ff;--amber:#ffb800;--text:#d8e8ff;--muted:#6e88ad}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:Consolas,monospace;height:100dvh;display:flex;flex-direction:column;overflow:hidden;touch-action:none}
  .hud{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:8px 10px;background:var(--panel);border-bottom:1px solid var(--border);z-index:20}
  .brand{font-weight:700;font-size:13px;color:var(--cyan);display:flex;align-items:center;gap:6px;margin-right:4px}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--cyan);box-shadow:0 0 8px var(--cyan)}
  select,input,button{background:#091120;color:var(--text);border:1px solid var(--border);border-radius:6px;padding:6px 9px;font-family:inherit;font-size:13px;outline:none;min-height:34px}
  button{cursor:pointer}
  button.active{background:rgba(0,240,255,.22);border-color:var(--cyan);color:#fff}
  .readout{margin-left:auto;display:flex;align-items:center;gap:8px;background:#04070d;border:1px solid var(--border);padding:4px 9px;border-radius:6px}
  .freq-val{font-size:15px;font-weight:700;color:var(--amber);min-width:106px;text-align:right}
  .zoom-val{font-size:11px;color:var(--muted)}
  .minimap-wrap{position:relative;height:46px;background:#03050a;border-bottom:1px solid var(--border);cursor:crosshair;overflow:hidden;touch-action:none}
  .minimap-wrap img{width:100%;height:100%;object-fit:fill;opacity:.75;pointer-events:none}
  .minimap-lens{position:absolute;top:0;height:100%;border:1px solid var(--cyan);background:rgba(0,240,255,.18);pointer-events:none}
  .viewport{position:relative;flex:1;overflow:hidden;cursor:grab;background:#04060b;touch-action:none}
  .viewport:active{cursor:grabbing}
  #wfImg{position:absolute;top:50%;left:0;transform-origin:0 50%;will-change:transform;pointer-events:none}
  .crosshair{position:absolute;top:0;bottom:0;width:1px;background:rgba(255,184,0,.85);pointer-events:none;z-index:10}
  .crosshair-tag{position:absolute;top:10px;left:6px;background:rgba(5,8,15,.92);border:1px solid var(--amber);color:var(--amber);padding:2px 6px;border-radius:4px;font-size:11px;font-weight:700;white-space:nowrap}
  .footer{padding:5px 10px;font-size:11px;color:var(--muted);background:var(--panel);border-top:1px solid var(--border);display:flex;justify-content:space-between;gap:8px}
  .kbd{color:var(--cyan)}
  @media(max-width:720px){
    .brand{display:none}
    .hide-mob{display:none}
    #dateSelect{max-width:148px;font-size:12px}
    #freqInput{width:96px !important;font-size:12px}
    button{padding:5px 8px;font-size:12px}
  }
</style>
</head>
<body>
<div class="hud">
  <div class="brand"><span class="dot"></span>SATCOM 248–268</div>
  <button id="prevBtn" title="Предыдущий (←)">◀</button>
  <select id="dateSelect"></select>
  <button id="nextBtn" title="Следующий (→)">▶</button>
  <button id="abBtn" title="A/B сравнение (Space)">A/B</button>
  <input id="freqInput" type="text" inputmode="decimal" placeholder="255.55" style="width:130px">
  <button id="goBtn">OK</button>
  <button id="fitBtn">Вся</button>
  <button id="oneToOneBtn" class="hide-mob">1:1</button>
  <div class="readout">
    <span class="zoom-val hide-mob" id="zoomReadout">1.0x</span>
    <span class="freq-val" id="freqReadout">258.000 MHz</span>
  </div>
</div>
<div class="minimap-wrap" id="minimap">
  <img id="miniImg" alt="">
  <div class="minimap-lens" id="miniLens"></div>
</div>
<div class="viewport" id="viewport">
  <img id="wfImg" alt="">
  <div class="crosshair" id="crosshair"><div class="crosshair-tag" id="crosshairTag">258.000 MHz</div></div>
</div>
<div class="footer">
  <div class="hide-mob"><span class="kbd">Колёсико</span> — зум · <span class="kbd">ЛКМ</span> — панорама · <span class="kbd">Space</span> — A/B</div>
  <div id="fileInfo">Загрузка...</div>
</div>
<script>
const START_MHZ=248,SPAN_MHZ=20;
let files=[],currentIdx=0,abTimer=null,scale=1,offsetX=0,imgW=12000,imgH=428,cursorX=null;
const $=id=>document.getElementById(id);
const wfImg=$("wfImg"),miniImg=$("miniImg"),miniLens=$("miniLens"),viewport=$("viewport"),minimap=$("minimap"),dateSelect=$("dateSelect"),freqReadout=$("freqReadout"),zoomReadout=$("zoomReadout"),crosshair=$("crosshair"),crosshairTag=$("crosshairTag"),fileInfo=$("fileInfo");

function clampOffset(){
  const vw=viewport.clientWidth,sw=imgW*scale;
  offsetX=sw<=vw?(vw-sw)/2:Math.min(0,Math.max(vw-sw,offsetX));
}
function updateCrosshair(x){
  const vw=viewport.clientWidth;
  const cx=(x!==null)?x:vw/2;
  const f=Math.min(1,Math.max(0,(cx-offsetX)/(imgW*scale)));
  const lbl=`${(START_MHZ+f*SPAN_MHZ).toFixed(3)} MHz`;
  freqReadout.textContent=lbl;
  crosshair.style.left=`${cx}px`;
  crosshairTag.textContent=lbl;
  crosshairTag.style.left=cx>vw-120?"-106px":"6px";
}
function renderTransform(){
  clampOffset();
  const vh=viewport.clientHeight,yScale=Math.min(1.6,Math.max(1,(vh*.85)/imgH));
  wfImg.style.transform=`translate(${offsetX}px,-50%) scale(${scale},${yScale})`;
  zoomReadout.textContent=`${(scale/(viewport.clientWidth/imgW)).toFixed(1)}x`;
  const vw=viewport.clientWidth;
  miniLens.style.left=`${Math.max(0,-offsetX/(imgW*scale))*100}%`;
  miniLens.style.width=`${Math.min(1,vw/(imgW*scale))*100}%`;
  updateCrosshair(cursorX);
}
function fitAll(){scale=viewport.clientWidth/imgW;offsetX=0;renderTransform()}
function zoomToFreq(mhz,ts=1){
  const f=(Math.min(268,Math.max(248,mhz))-START_MHZ)/SPAN_MHZ;
  scale=Math.max(viewport.clientWidth/imgW,Math.min(4,ts));
  offsetX=viewport.clientWidth/2-f*imgW*scale;renderTransform();
}
function loadSnapshot(idx,keep=true){
  if(!files.length)return;
  currentIdx=(idx+files.length)%files.length;
  dateSelect.value=currentIdx;
  const file=files[currentIdx];
  fileInfo.textContent=`${file.replace(/^satcom_248-268MHz_/,"")} (${currentIdx+1}/${files.length})`;
  wfImg.onload=()=>{imgW=wfImg.naturalWidth||12000;imgH=wfImg.naturalHeight||428;keep?renderTransform():fitAll()};
  wfImg.src=file;miniImg.src=file;
}

viewport.addEventListener("wheel",e=>{
  e.preventDefault();
  const r=viewport.getBoundingClientRect(),mx=e.clientX-r.left,ix=(mx-offsetX)/scale;
  scale=Math.max(viewport.clientWidth/imgW,Math.min(4,scale*(e.deltaY<0?1.28:1/1.28)));
  offsetX=mx-ix*scale;renderTransform();
},{passive:false});

let drag=false,sx=0,so=0,mDrag=false;
viewport.addEventListener("mousedown",e=>{drag=true;sx=e.clientX;so=offsetX});
window.addEventListener("mouseup",()=>{drag=false;mDrag=false});
window.addEventListener("mousemove",e=>{
  if(drag){offsetX=so+(e.clientX-sx);renderTransform()}
  if(mDrag)seekMini(e.clientX);
  const r=viewport.getBoundingClientRect();
  if(e.clientY>=r.top&&e.clientY<=r.bottom&&e.clientX>=r.left&&e.clientX<=r.right){
    cursorX=e.clientX-r.left;updateCrosshair(cursorX);
  }
});

let tMode=null,tStartX=0,tStartOffset=0,pinchDist=0,pinchScale=1,pinchImgX=0,lastTap=0;
function getDist(t){return Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY)}
function getMidX(t,r){return(t[0].clientX+t[1].clientX)/2-r.left}

viewport.addEventListener("touchstart",e=>{
  const r=viewport.getBoundingClientRect();
  if(e.touches.length===1){
    const now=Date.now();
    const tx=e.touches[0].clientX-r.left;
    if(now-lastTap<280){
      const base=viewport.clientWidth/imgW;
      if(scale>base*1.5)fitAll();
      else{
        const f=Math.min(1,Math.max(0,(tx-offsetX)/(imgW*scale)));
        zoomToFreq(START_MHZ+f*SPAN_MHZ,1.0);
      }
      lastTap=0;return;
    }
    lastTap=now;
    tMode="pan";tStartX=e.touches[0].clientX;tStartOffset=offsetX;cursorX=tx;updateCrosshair(cursorX);
  }else if(e.touches.length===2){
    tMode="pinch";pinchDist=getDist(e.touches);pinchScale=scale;
    const mx=getMidX(e.touches,r);pinchImgX=(mx-offsetX)/scale;cursorX=mx;
  }
},{passive:true});

viewport.addEventListener("touchmove",e=>{
  e.preventDefault();
  const r=viewport.getBoundingClientRect();
  if(tMode==="pan"&&e.touches.length===1){
    offsetX=tStartOffset+(e.touches[0].clientX-tStartX);
    cursorX=e.touches[0].clientX-r.left;
    renderTransform();
  }else if(tMode==="pinch"&&e.touches.length===2){
    const d=getDist(e.touches),mx=getMidX(e.touches,r);
    scale=Math.max(viewport.clientWidth/imgW,Math.min(4,pinchScale*(d/pinchDist)));
    offsetX=mx-pinchImgX*scale;cursorX=mx;
    renderTransform();
  }
},{passive:false});
viewport.addEventListener("touchend",e=>{if(e.touches.length===0)tMode=null;else if(e.touches.length===1){tMode="pan";tStartX=e.touches[0].clientX;tStartOffset=offsetX}});

function seekMini(clientX){
  const r=minimap.getBoundingClientRect(),f=Math.min(1,Math.max(0,(clientX-r.left)/r.width));
  offsetX=viewport.clientWidth/2-f*imgW*scale;renderTransform();
}
minimap.addEventListener("mousedown",e=>{mDrag=true;seekMini(e.clientX)});
minimap.addEventListener("touchstart",e=>{e.preventDefault();seekMini(e.touches[0].clientX)},{passive:false});
minimap.addEventListener("touchmove",e=>{e.preventDefault();seekMini(e.touches[0].clientX)},{passive:false});

dateSelect.onchange=()=>loadSnapshot(+dateSelect.value,true);
$("prevBtn").onclick=()=>loadSnapshot(currentIdx+1,true);
$("nextBtn").onclick=()=>loadSnapshot(currentIdx-1,true);
$("fitBtn").onclick=fitAll;
$("oneToOneBtn").onclick=()=>zoomToFreq(START_MHZ+((viewport.clientWidth/2-offsetX)/(imgW*scale))*SPAN_MHZ,1);
$("goBtn").onclick=()=>{const v=parseFloat($("freqInput").value.replace(",","."));if(!isNaN(v))zoomToFreq(v,Math.max(scale,1))};
$("freqInput").onkeydown=e=>{if(e.key==="Enter")$("goBtn").click()};

function toggleAB(){
  if(abTimer){clearInterval(abTimer);abTimer=null;$("abBtn").classList.remove("active");return}
  if(files.length<2)return;
  const b=currentIdx,a=(currentIdx+1)%files.length;let s=false;$("abBtn").classList.add("active");
  abTimer=setInterval(()=>{s=!s;loadSnapshot(s?a:b,true)},850);
}
$("abBtn").onclick=toggleAB;
window.onkeydown=e=>{
  if(document.activeElement.tagName==="INPUT")return;
  if(e.key==="ArrowLeft")loadSnapshot(currentIdx+1,true);
  if(e.key==="ArrowRight")loadSnapshot(currentIdx-1,true);
  if(e.code==="Space"){e.preventDefault();toggleAB()}
};
window.onresize=renderTransform;

(async()=>{
  try{const r=await fetch("manifest.json?t="+Date.now());if(r.ok)files=await r.json()}catch(e){}
  if(!files.length){
    const api=await fetch("https://api.github.com/repos/satcom-uhf/satcom-snapshots/contents/");
    files=(await api.json()).map(x=>x.name).filter(n=>/\.(webp|png)$/i.test(n)).sort().reverse();
  }
  files.forEach((f,i)=>{
    const o=document.createElement("option");o.value=i;
    o.textContent=f.replace(/^satcom_248-268MHz_/,"").replace(/\.(webp|png)$/i,"").replace("_"," ");
    dateSelect.appendChild(o);
  });
  files.length?loadSnapshot(0,false):fileInfo.textContent="Снимков пока нет.";
})();
</script>
</body>
</html>
